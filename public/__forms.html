<!doctype html>
<html lang="en">
  <body>
    <form name="contact" method="POST" data-netlify="true" data-netlify-recaptcha="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="contact" />
      <input name="name" />
      <input name="email" />
      <select name="subject">
        <option value="general">General Inquiry</option>
      </select>
      <textarea name="message"></textarea>
      <input name="bot-field" />
      <div data-netlify-recaptcha="true"></div>
    </form>
  </body>
</html>
